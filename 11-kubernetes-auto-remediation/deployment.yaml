apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processing-worker
  namespace: production
  labels:
    app: payment-worker
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-worker
  template:
    metadata:
      labels:
        app: payment-worker
    spec:
      containers:
      - name: worker
        image: systemzero/payment-worker:v2.4.1
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"  # Too low! Triggers OOMKilled (Exit Code 137)
          requests:
            cpu: "250m"
            memory: "128Mi"
        env:
        - name: WORKER_QUEUE
          value: "high-priority-settlements"
